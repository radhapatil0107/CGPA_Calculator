{% extends "base.html" %}

{% block title %}Login / Register{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 1.5rem auto;">
  <div class="card" style="padding: 2.25rem;">
    
    <!-- Student Identity Header -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="college-tag">
        <span>👨‍🎓</span> Student Academic Portal
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 700; color: var(--text-main);">
        Student Portal
      </h2>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.25rem;">
        Academic Grade &amp; CGPA Portal &bull; D.Y. Patil College
      </p>
    </div>

    <!-- Mode Switch Tabs -->
    <div style="display: flex; background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 1.75rem; gap: 4px;">
      <button type="button" id="tabLogin" class="btn btn-sm btn-block" style="border-radius: var(--radius-sm); font-weight: 600;" onclick="switchAuthTab('login')">
        Sign In
      </button>
      <button type="button" id="tabRegister" class="btn btn-sm btn-block btn-secondary" style="border-radius: var(--radius-sm); font-weight: 600;" onclick="switchAuthTab('register')">
        Register
      </button>
      <button type="button" id="tabReset" class="btn btn-sm btn-block btn-secondary" style="border-radius: var(--radius-sm); font-weight: 600;" onclick="switchAuthTab('reset')">
        Reset Password
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" method="POST" action="{{ url_for('login_view') }}" autocomplete="off">
      <input type="hidden" name="action" value="login">
      <input type="hidden" name="next" value="{{ next_url or '' }}">

      <!-- Anti-autofill decoy inputs to prevent browser password managers from pre-filling credentials -->
      <input type="text" name="fake_user_trap" style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="password" name="fake_pass_trap" style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;" tabindex="-1" autocomplete="new-password" aria-hidden="true">

      <div class="form-group">
        <label for="loginEmail" class="form-label">
          Email ID / Username / Name <span class="req">*</span>
        </label>
        <input 
          type="text" 
          id="loginEmail" 
          name="email" 
          class="form-control" 
          placeholder="Enter your Email ID, Username, or Full Name" 
          required 
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          value=""
        >
      </div>

      <div class="form-group">
        <label for="loginPassword" class="form-label">
          Password <span class="req">*</span>
        </label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="loginPassword" 
            name="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
            value=""
          >
          <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('loginPassword', this)">
            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" x2="22" y1="2" y2="22"/>
            </svg>
          </button>
        </div>
        <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 0.5rem;">
          <a href="javascript:void(0)" onclick="switchAuthTab('reset')" style="font-size: 0.8rem; color: var(--primary); text-decoration: underline;">
            Forgot password?
          </a>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Sign In to Portal &rarr;
      </button>

      <div style="text-align: right; margin-top: 0.85rem;">
        <a href="javascript:void(0)" onclick="switchAuthTab('reset')" style="font-size: 0.88rem; color: var(--primary); text-decoration: none; font-weight: 500;">
          Forgot / Reset Password?
        </a>
      </div>
    </form>

    <!-- Register Form -->
    <form id="registerForm" method="POST" action="{{ url_for('login_view') }}" style="display: none;">
      <input type="hidden" name="action" value="register">
      <input type="hidden" name="next" value="{{ next_url or '' }}">

      <div class="form-group">
        <label for="regName" class="form-label">
          Full Name <span class="req">*</span>
        </label>
        <input 
          type="text" 
          id="regName" 
          name="name" 
          class="form-control" 
          placeholder="Enter your full name" 
          required
          autocomplete="name"
        >
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="regRollNo" class="form-label">
            Roll Number <span style="font-weight: 400; color: var(--text-muted); font-size: 0.8rem;">(e.g. DS-201 or 69)</span>
          </label>
          <input 
            type="text" 
            id="regRollNo" 
            name="roll_no" 
            class="form-control" 
            placeholder="e.g. DS-201" 
          >
        </div>

        <div class="form-group">
          <label for="regPrn" class="form-label">
            PRN Number <span style="font-weight: 400; color: var(--text-muted); font-size: 0.8rem;">(Permanent Reg. No)</span>
          </label>
          <input 
            type="text" 
            id="regPrn" 
            name="prn" 
            class="form-control" 
            placeholder="e.g. 202401234567" 
          >
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail" class="form-label">
          Email ID <span class="req">*</span>
        </label>
        <input 
          type="email" 
          id="regEmail" 
          name="email" 
          class="form-control" 
          placeholder="Enter your email ID" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="regUsername" class="form-label">
          Username <span style="font-weight: 400; color: var(--text-muted); font-size: 0.8rem;">(Optional &bull; e.g. sahil)</span>
        </label>
        <input 
          type="text" 
          id="regUsername" 
          name="username" 
          class="form-control" 
          placeholder="Choose a username (or leave blank to auto-use first name)" 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="regBranch" class="form-label">
          Branch &amp; Degree <span class="req">*</span>
        </label>
        <input 
          type="text" 
          id="regBranch" 
          name="branch" 
          class="form-control" 
          placeholder="e.g. B.Tech Computer Science & Engineering (Data Science)" 
          value="B.Tech Computer Science & Engineering (Data Science)"
          required
        >
      </div>

      <div class="form-group">
        <label for="regCollege" class="form-label">
          College / Institution Name <span class="req">*</span>
        </label>
        <input 
          type="text" 
          id="regCollege" 
          name="college" 
          class="form-control" 
          value="D.Y. Patil College of Engineering & Technology, Kolhapur" 
          required
        >
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="regPassword" class="form-label">
            Password <span class="req">*</span>
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="regPassword" 
              name="password" 
              class="form-control" 
              placeholder="Choose password" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('regPassword', this)">
              <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">
            Confirm Password <span class="req">*</span>
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="regConfirmPassword" 
              name="confirm_password" 
              class="form-control" 
              placeholder="Re-enter password" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('regConfirmPassword', this)">
              <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Register &amp; Create Profile &rarr;
      </button>
    </form>

    <!-- Reset Password Form -->
    <form id="resetForm" method="POST" action="{{ url_for('login_view') }}" style="display: none;">
      <input type="hidden" name="action" value="reset_password">

      <div class="form-group">
        <label for="resetEmail" class="form-label">
          Registered Email ID / Unique ID <span class="req">*</span>
        </label>
        <input 
          type="text" 
          id="resetEmail" 
          name="email" 
          class="form-control" 
          placeholder="e.g. student@gmail.com or EN25276191" 
          required
          autocomplete="username"
        >
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="resetNewPassword" class="form-label">
            New Password <span class="req">*</span>
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="resetNewPassword" 
              name="new_password" 
              class="form-control" 
              placeholder="Enter new password" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('resetNewPassword', this)">
              <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="resetConfirmPassword" class="form-label">
            Confirm Password <span class="req">*</span>
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="resetConfirmPassword" 
              name="confirm_password" 
              class="form-control" 
              placeholder="Confirm new password" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility('resetConfirmPassword', this)">
              <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Update Password &amp; Sign In &rarr;
      </button>
    </form>

    <!-- Reset Password Form -->
    <form id="resetForm" method="POST" action="{{ url_for('login_view') }}" style="display: none;">
      <input type="hidden" name="action" value="reset_password">
      <input type="hidden" name="next" value="{{ next_url or '' }}">

      <div class="form-group">
        <label for="resetEmail" class="form-label">
          Registered Email ID or Username <span class="req">*</span>
        </label>
        <input 
          type="text" 
          id="resetEmail" 
          name="email" 
          class="form-control" 
          placeholder="e.g. sahil or student@example.com" 
          required
        >
      </div>

      <div class="form-group">
        <label for="resetNewPassword" class="form-label">
          New Password <span class="req">*</span>
        </label>
        <input 
          type="password" 
          id="resetNewPassword" 
          name="new_password" 
          class="form-control" 
          placeholder="Enter new password" 
          required
        >
      </div>

      <div class="form-group">
        <label for="resetConfirmPassword" class="form-label">
          Confirm New Password <span class="req">*</span>
        </label>
        <input 
          type="password" 
          id="resetConfirmPassword" 
          name="confirm_new_password" 
          class="form-control" 
          placeholder="Re-enter new password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Update Password Now &rarr;
      </button>

      <div style="text-align: center; margin-top: 1rem;">
        <a href="javascript:void(0)" onclick="switchAuthTab('login')" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">
          &larr; Back to Sign In
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const eyeOpen = btn.querySelector('.eye-open');
  const eyeClosed = btn.querySelector('.eye-closed');

  if (input.type === 'password') {
    input.type = 'text';
    btn.setAttribute('aria-label', 'Hide password');
    btn.setAttribute('title', 'Hide password');
    if (eyeOpen) eyeOpen.style.display = 'none';
    if (eyeClosed) eyeClosed.style.display = 'block';
  } else {
    input.type = 'password';
    btn.setAttribute('aria-label', 'Show password');
    btn.setAttribute('title', 'Show password');
    if (eyeOpen) eyeOpen.style.display = 'block';
    if (eyeClosed) eyeClosed.style.display = 'none';
  }
}

function switchAuthTab(mode) {
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const resetForm = document.getElementById('resetForm');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const tabReset = document.getElementById('tabReset');

  if (mode === 'register') {
    if (loginForm) loginForm.style.display = 'none';
    if (registerForm) registerForm.style.display = 'block';
    if (resetForm) resetForm.style.display = 'none';
    if (tabLogin) tabLogin.className = 'btn btn-sm btn-block btn-secondary';
    if (tabRegister) tabRegister.className = 'btn btn-sm btn-block btn-primary';
    if (tabReset) tabReset.className = 'btn btn-sm btn-block btn-secondary';
  } else if (mode === 'reset') {
    if (loginForm) loginForm.style.display = 'none';
    if (registerForm) registerForm.style.display = 'none';
    if (resetForm) resetForm.style.display = 'block';
    if (tabLogin) tabLogin.className = 'btn btn-sm btn-block btn-secondary';
    if (tabRegister) tabRegister.className = 'btn btn-sm btn-block btn-secondary';
    if (tabReset) tabReset.className = 'btn btn-sm btn-block btn-primary';
  } else {
    if (loginForm) loginForm.style.display = 'block';
    if (registerForm) registerForm.style.display = 'none';
    if (resetForm) resetForm.style.display = 'none';
    if (tabLogin) tabLogin.className = 'btn btn-sm btn-block btn-primary';
    if (tabRegister) tabRegister.className = 'btn btn-sm btn-block btn-secondary';
    if (tabReset) tabReset.className = 'btn btn-sm btn-block btn-secondary';
  }
}

// Initialize active tab
switchAuthTab('{{ auth_mode or "login" }}');

// Clear browser autofilled credentials on initial load so fields start empty
function clearAutofilledLogin() {
  const emailInput = document.getElementById('loginEmail');
  const passInput = document.getElementById('loginPassword');
  if (emailInput && !emailInput.matches(':focus')) {
    emailInput.value = '';
  }
  if (passInput && !passInput.matches(':focus')) {
    passInput.value = '';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  clearAutofilledLogin();
  setTimeout(clearAutofilledLogin, 50);
  setTimeout(clearAutofilledLogin, 200);
});

window.addEventListener('pageshow', () => {
  clearAutofilledLogin();
});
</script>
{% endblock %}
